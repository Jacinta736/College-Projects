<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexBank – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg:       #0a0e17;
        --panel:    #111827;
        --border:   #1e2d45;
        --accent:   #3b82f6;
        --accent2:  #06b6d4;
        --text:     #e2e8f0;
        --muted:    #64748b;
        --danger:   #ef4444;
        --success:  #22c55e;
        --radius:   14px;
    }

    body {
        font-family: 'DM Sans', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* animated background grid */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
        linear-gradient(rgba(59,130,246,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,.06) 1px, transparent 1px);
        background-size: 48px 48px;
        animation: gridMove 20s linear infinite;
        pointer-events: none;
    }
    @keyframes gridMove { to { background-position: 48px 48px; } }

    /* glow orbs */
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; }
    .orb1 { width: 400px; height: 400px; background: rgba(59,130,246,.15); top: -100px; left: -100px; }
    .orb2 { width: 300px; height: 300px; background: rgba(6,182,212,.10); bottom: -80px; right: -80px; }

    .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 48px 44px;
        width: 100%;
        max-width: 420px;
        position: relative;
        z-index: 1;
        box-shadow: 0 0 60px rgba(59,130,246,.08), 0 24px 48px rgba(0,0,0,.4);
        animation: fadeUp .5s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: translateY(0); } }

    .logo {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -1px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
    }

    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 36px; }

    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; letter-spacing: .4px; }

    .field { margin-bottom: 20px; }

    input[type=text], input[type=password] {
        width: 100%;
        background: rgba(255,255,255,.04);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 16px;
        color: var(--text);
        font-family: 'DM Sans', sans-serif;
        font-size: 15px;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }

    .btn {
        width: 100%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        border: none;
        border-radius: var(--radius);
        padding: 14px;
        font-family: 'Syne', sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: .5px;
        cursor: pointer;
        transition: opacity .2s, transform .1s;
        margin-top: 8px;
    }
    .btn:hover  { opacity: .9; }
    .btn:active { transform: scale(.98); }

    .error {
        background: rgba(239,68,68,.12);
        border: 1px solid rgba(239,68,68,.3);
        color: #fca5a5;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 20px;
    }
    </style>
    </head>
    <body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div class="card">
    <div class="logo">NexBank</div>
    <p class="subtitle">Sign in to your account</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required autocomplete="off">
        </div>
        <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
        </div>
        <button class="btn" type="submit">Sign In →</button>
    </form>
    </div>
    </body>
    </html>
